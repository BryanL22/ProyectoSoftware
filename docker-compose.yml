services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d productos_db"]
      interval: 5s
      retries: 10
    networks: [crud-net]
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/productos_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    networks: [crud-net]
volumes:
  pgdata:
networks:
  crud-net:
